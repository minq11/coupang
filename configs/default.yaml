# 모든 Stage 의 기본 파라미터와 모델 선택.
# Job 생성 시 이 파일이 work/<job_id>/params.json 으로 복사되고, GUI/CLI 는 그 사본을 수정한다.

_job:
  input_mode: mono        # mono (2D 사진 1장) | sbs (스테레오 SBS). Job 생성 시 CLI/GUI 로 지정 가능.

stage_00_split:
  swap_lr: false          # 입력이 우=Left 로 배열돼 있으면 true
  rectify: false          # 수직 시차 보정 (y 방향 평행이동만)
  matcher: lightglue      # sift | lightglue  (lightglue 설치됨)
  max_features: 4000
  dy_warn_px: 1.0         # 중앙값 |dy| 가 이 값보다 크면 경고

stage_01_fov:
  hfov_deg: 80.0          # 수동 입력. 결과 전체를 좌우하는 가장 중요한 값
  auto_estimate: true     # GeoCalib 자동 추정 (설치됨)
  auto_min_confidence: 0.5
  estimator: geocalib     # geocalib | manual

stage_02_reproj:
  size: 4096              # 눈당 S×S half-equirect 캔버스
  interpolation: lanczos  # lanczos | cubic | linear | nearest
  preview_only_background: black   # Quest 미리보기에서 원본 밖 채울 색
  # 생성 범위 (타원): 정면에서 몇 도까지 "제대로" 만들지. 바깥은 페이드로 어둡게.
  # 기본은 "원본 화각 + 여유". 80° 16:9 사진이면 자동으로 ~120×100 이 됨.
  extent_margin_h_deg: 20       # 수평 여유 (한쪽 기준). extent_h_deg 가 null 일 때만 사용 (hfov + 2·margin).
  extent_margin_v_deg: 25       # 수직 여유 (한쪽 기준). extent_v_deg 가 null 일 때만 사용 (vfov + 2·margin).
  extent_h_deg: 180             # 고정 수평 범위(°). 기본 180 = 반구 전체 생성 (기능 꺼짐). 좁히면 바깥은 페이드.
  extent_v_deg: 180             # 고정 수직 범위(°). 기본 180 = 반구 전체 생성 (기능 꺼짐).
  extent_fade_deg: 10           # 페이드 폭(°). 8° 미만이면 깊이 벽 느껴짐.
  extent_color: [0, 0, 0]       # 바깥 색 (RGB 0..255).
  extent_shape: ellipse         # ellipse | rounded_rect
  tile_min_new_fraction: 0.01   # Stage 3: 새로 채울 픽셀이 이 비율 미만이면 타일 생략.

stage_03_outpaint:
  inpainter: opencv       # opencv | sdxl | flux   (opencv 는 Telea — 빠르고 묘사 없음, 주변시 방해↓)
  prompt: "indoor scene, natural lighting, photorealistic, consistent perspective"
  negative_prompt: "text, watermark, people, blurry, distorted"
  seed: 42
  steps: 30
  guidance: 30.0        # FLUX 는 30 근처, SDXL 는 7 근처 권장
  tile_res: 1024          # 타일 해상도 (고정 권장)
  tile_fov_deg: 90.0
  tile_yaws_deg: [-60, 0, 60]
  tile_pitches_deg: [-45, 0, 45]
  feather_px: 64
  mask_dilate_px: 8
  strength: 1.0
  # 비워 두면 전체 타일. 특정 타일만 재생성하려면 이름 나열: ["y+60_p0", ...]
  only_tiles: []
  # true 면 기존 tiles/ 결과를 재사용하고 only_tiles 만 다시 만든다
  reuse_existing_tiles: false
  # 타일별 프롬프트 override. {타일이름: 프롬프트}. 비어 있으면 공통 prompt 사용.
  # 예: {"y+0_p-45": "wooden plank floor, natural lighting"}
  tile_prompt_overrides: {}

stage_04_stereo:
  matcher: raft_stereo    # sgbm | raft_stereo | raft_flow   (RAFT-Stereo 설치됨)
  max_disparity: 256      # 픽셀. 원본 해상도 기준
  angular_exact: true     # Δθ = d_px / f / (1 + x²)  (false 면 d_px / f)
  raft_iters: 32
  raft_weights: middlebury   # middlebury | sceneflow | eth3d

stage_05_depth:
  estimator: da2_large    # da2_large | da2_base | da2_small | none (none 이면 stereo disparity 를 바깥으로 외삽)
  tile_mode: true         # Stage 3 과 같은 타일 분할로 mono depth. false 면 pano 전체에 한 번
  band_deg: 5.0           # 원본 경계 안쪽 피팅 띠 폭 (sbs 모드)
  blend_deg: 8.0          # 경계 블렌딩 폭 (sbs 모드)
  ransac_iters: 500
  ransac_thresh: 0.004    # rad. 각도 disparity 단위 inlier 임계값
  polar_start_deg: 75.0   # 이 위도부터 disparity 를 줄이기 시작
  polar_min_disp: 0.0     # 극에서의 최소 disparity (rad)
  override_a: null        # 수동 오버라이드 (null 이면 피팅값)
  override_b: null
  min_inlier_ratio: 0.6
  # mono 모드 전용:
  depth_strength: 0.02    # 각도 disparity 최댓값(rad). ≈1.1° 가 Quest 에서 편한 수준.
  depth_map_path: null    # 외부 툴 깊이 지도(PNG/npy) 경로. null 이면 Depth Anything.

stage_06_right:
  hole_px: 400            # 이 면적(px²) 이하 구멍은 Telea, 초과는 inpaint 모델
  inpainter: opencv       # opencv | sdxl | flux
  blend_deg: 8.0
  splat_taps: 2           # 1 | 2  (2 면 양 옆 픽셀에도 splat 해서 균열 감소)
  mono_symmetric: true    # mono 모드: true 면 가운데 뷰를 양쪽으로 ±d/2 워핑 (기본).
                          # false 면 가운데 뷰 = 왼눈, 오른눈만 −d 워핑.

stage_07_output:
  suffix: _180_3dh        # _180_3dh | _LR | ""
  jpg_quality: 95
  write_xmp: true
  write_jpg: true

video:
  depth_model: da2_video  # vda_large | vda_small | da2_video | none
  chunk: 32               # VDA chunk 크기
  overlap: 8              # VDA chunk 겹침

models:
  sdxl_inpaint_id: diffusers/stable-diffusion-xl-1.0-inpainting-0.1
  flux_fill_id: black-forest-labs/FLUX.1-Fill-dev
  flux_fill_gguf_repo: YarvixPA/FLUX.1-Fill-dev-GGUF
  flux_fill_gguf_file: flux1-fill-dev-Q4_K_S.gguf
  flux_quant: gguf        # gguf | nf4 | none
  da2_large_id: depth-anything/Depth-Anything-V2-Large-hf
  da2_base_id: depth-anything/Depth-Anything-V2-Base-hf
  da2_small_id: depth-anything/Depth-Anything-V2-Small-hf
  raft_stereo_repo: https://github.com/princeton-vl/RAFT-Stereo.git
  device: auto            # auto | cuda | cpu
