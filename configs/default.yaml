# 모든 Stage 의 기본 파라미터와 모델 선택.
# Job 생성 시 이 파일이 work/<job_id>/params.json 으로 복사되고, GUI/CLI 는 그 사본을 수정한다.

_job:
  input_mode: mono        # mono (2D 사진 1장) | sbs (스테레오 SBS). Job 생성 시 CLI/GUI 로 지정 가능.

stage_00_split:
  swap_lr: false          # 입력이 우=Left 로 배열돼 있으면 true
  rectify: false          # 수직 시차 보정 (y 방향 평행이동만)
  matcher: lightglue      # sift | lightglue  (lightglue 설치됨)
  max_features: 4000
  dy_warn_px: 1.0         # 중앙값 |dy| 가 이 값보다 크면 경고

stage_01_fov:
  hfov_deg: 80.0          # 수동 입력. 결과 전체를 좌우하는 가장 중요한 값
  auto_estimate: true     # GeoCalib 자동 추정 (설치됨)
  auto_min_confidence: 0.5
  estimator: geocalib     # geocalib | manual

stage_02_reproj:
  size: 4096              # 눈당 S×S half-equirect 캔버스
  interpolation: lanczos  # lanczos | cubic | linear | nearest
  preview_only_background: black   # Quest 미리보기에서 원본 밖 채울 색
  pitch_offset_deg: 0.0   # VR 적도(=뷰어 정면) 를 입력 사진의 어디로 맞출지. + = 위쪽(얼굴 쪽).
                          #                            전신 세로샷 → 얼굴에 맞추려면 +20~+30 쯤.
  # 생성 범위 (타원): 정면에서 몇 도까지 "제대로" 만들지. 바깥은 페이드로 어둡게.
  # 기본은 "원본 화각 + 여유". 80° 16:9 사진이면 자동으로 ~120×100 이 됨.
  extent_margin_h_deg: 20       # 수평 여유 (한쪽 기준). extent_h_deg 가 null 일 때만 사용 (hfov + 2·margin).
  extent_margin_v_deg: 25       # 수직 여유 (한쪽 기준). extent_v_deg 가 null 일 때만 사용 (vfov + 2·margin).
  extent_h_deg: 180             # 고정 수평 범위(°). 기본 180 = 반구 전체 생성 (기능 꺼짐). 좁히면 바깥은 페이드.
  extent_v_deg: 180             # 고정 수직 범위(°). 기본 180 = 반구 전체 생성 (기능 꺼짐).
  extent_fade_deg: 10           # 페이드 폭(°). 8° 미만이면 깊이 벽 느껴짐.
  extent_color: [0, 0, 0]       # 바깥 색 (RGB 0..255).
  extent_shape: ellipse         # ellipse | rounded_rect
  tile_min_new_fraction: 0.01   # Stage 3: 새로 채울 픽셀이 이 비율 미만이면 타일 생략.

stage_03_outpaint:
  inpainter: opencv       # opencv | stretch | lama | sdxl_lightning | sdxl_lcm
                          # 빠른 순. opencv/stretch 는 모델 없음, lama 는 경량 신경망(프롬프트 없음), sdxl_* 는 SDXL inpainting + 가속 LoRA
  prompt: "indoor scene, natural lighting, photorealistic, consistent perspective"
  negative_prompt: "text, watermark, people, blurry, distorted"
  seed: 42
  steps: 30               # sdxl_lightning/lcm 은 12 초과 값을 변형 기본값(4 / 8)으로 자동 치환. 12 이하면 그대로 사용
  guidance: 7.0           # sdxl_lightning 은 항상 0 (CFG 없음). sdxl_lcm 은 2.5 초과면 1.5 로, 아니면 1~2 로 클립
  tile_res: 1024          # 타일 해상도 (고정 권장)
  tile_fov_deg: 90.0
  tile_yaws_deg: [-60, 0, 60]
  tile_pitches_deg: [-45, 0, 45]
  feather_px: 64
  mask_dilate_px: 8
  strength: 1.0
  # 비워 두면 전체 타일. 특정 타일만 재생성하려면 이름 나열: ["y+60_p0", ...]
  only_tiles: []
  # true 면 기존 tiles/ 결과를 재사용하고 only_tiles 만 다시 만든다
  reuse_existing_tiles: false
  # 타일별 프롬프트 override. {타일이름: 프롬프트}. 비어 있으면 공통 prompt 사용.
  # 예: {"y+0_p-45": "wooden plank floor, natural lighting"}
  tile_prompt_overrides: {}

stage_04_stereo:
  matcher: raft_stereo    # sgbm | raft_stereo | raft_flow   (RAFT-Stereo 설치됨)
  max_disparity: 256      # 픽셀. 원본 해상도 기준
  angular_exact: true     # Δθ = d_px / f / (1 + x²)  (false 면 d_px / f)
  raft_iters: 32
  raft_weights: middlebury   # middlebury | sceneflow | eth3d

stage_05_depth:
  estimator: da2_large    # da2_large | da2_base | da2_small | none (none 이면 stereo disparity 를 바깥으로 외삽)
  tile_mode: true         # Stage 3 과 같은 타일 분할로 mono depth. false 면 pano 전체에 한 번
  band_deg: 5.0           # 원본 경계 안쪽 피팅 띠 폭 (sbs 모드)
  blend_deg: 8.0          # 경계 블렌딩 폭 (sbs 모드)
  ransac_iters: 500
  ransac_thresh: 0.004    # rad. 각도 disparity 단위 inlier 임계값
  polar_start_deg: 75.0   # 이 위도부터 disparity 를 줄이기 시작
  polar_min_disp: 0.0     # 극에서의 최소 disparity (rad)
  override_a: null        # 수동 오버라이드 (null 이면 피팅값)
  override_b: null
  min_inlier_ratio: 0.6
  # mono 모드 전용:
  depth_strength: 0.02    # 각도 disparity 최댓값(rad). ≈1.1° 가 Quest 에서 편한 수준.
  depth_map_path: null    # 외부 툴 깊이 지도(PNG/npy) 경로. null 이면 Depth Anything.

stage_06_right:
  hole_px: 400            # 이 면적(px²) 이하 구멍은 Telea, 초과는 inpaint 모델
  inpainter: opencv       # opencv | stretch | lama | sdxl_lightning | sdxl_lcm (Stage 3 과 별개, 큰 구멍 전용)
  blend_deg: 8.0
  splat_taps: 2           # 1 | 2  (2 면 양 옆 픽셀에도 splat 해서 균열 감소)
  mono_symmetric: true    # mono 모드: true 면 가운데 뷰를 양쪽으로 ±d/2 워핑 (기본).
                          # false 면 가운데 뷰 = 왼눈, 오른눈만 −d 워핑.

stage_07_output:
  suffix: _180_3dh        # _180_3dh | _LR | ""
  jpg_quality: 95
  write_xmp: true
  write_jpg: true

video:
  depth_model: da2_video  # vda_large | vda_small | da2_video | none
  edge_blend_deg: 1.0     # 원본 영역 경계에서 프레임 → 고정 주변부로 섞는 폭(°). 원본 안쪽으로 이만큼만 침범.
                          # 0 = 경계에서 바로 전환. 예전 기본(stage_06_right.blend_deg=8) 은 원본이 8° 흐려졌다.
  gpu_remap: true         # CUDA 가 있으면 프레임 재투영·블렌딩을 GPU 에서 (sbs 모드). false = cv2 (CPU)
  gpu_yuv: true           # GPU 경로에서 yuv420p 평면을 바로 만들어 인코더로 보냄 (파이프 절반, ffmpeg 색변환 생략)
  chunk: 32               # VDA chunk 크기
  overlap: 8              # VDA chunk 겹침

models:
  sdxl_inpaint_id: diffusers/stable-diffusion-xl-1.0-inpainting-0.1
  sdxl_lcm_lora_id: latent-consistency/lcm-lora-sdxl          # inpainter=sdxl_lcm
  sdxl_lightning_repo: ByteDance/SDXL-Lightning                # inpainter=sdxl_lightning
  sdxl_lightning_file: sdxl_lightning_4step_lora.safetensors
  # inpainter=lama 세부. 점진 모드: 경계부터 band_px 폭 띠 단위로 넓혀 가며 채운다 (한 번에 돌리면 질감 죽).
  lama_progressive: true
  lama_band_px: 128           # 추론 해상도(lama_infer_size) 기준
  lama_infer_size: 512        # 타일을 이 크기로 줄여 추론 후 복원
  lama_max_steps: 16
  # inpainter=stretch (늘리기+블러) 세부. 비율은 타일 긴 변 기준.
  stretch_sigma_min_frac: 0.01
  stretch_sigma_max_frac: 0.08
  stretch_reach_frac: 0.5
  stretch_darken: 0.15
  da2_large_id: depth-anything/Depth-Anything-V2-Large-hf
  da2_base_id: depth-anything/Depth-Anything-V2-Base-hf
  da2_small_id: depth-anything/Depth-Anything-V2-Small-hf
  # 인물 AR (MIT). trust_remote_code 로 불러온다.
  birefnet_matting_id: ZhengPeng7/BiRefNet-matting
  birefnet_portrait_id: ZhengPeng7/BiRefNet-portrait
  person_sam2_size: small     # fetch-models --person 이 받을 SAM 2.1 크기
  raft_stereo_repo: https://github.com/princeton-vl/RAFT-Stereo.git
  # Video Depth Anything (영상 전용 시간축 깊이, iw3 없이 2D 영상 → VR180 가능하게 함)
  vda_repo: https://github.com/DepthAnything/Video-Depth-Anything.git
  vda_small_hf: depth-anything/Video-Depth-Anything-Small
  vda_large_hf: depth-anything/Video-Depth-Anything-Large
  vda_small_file: video_depth_anything_vits.pth
  vda_large_file: video_depth_anything_vitl.pth
  device: auto            # auto | cuda | cpu

# ───────────────────────────────────────────── 인물 AR (vr180 person / GUI '인물 AR' 탭)
# 2D 사진·영상 속 모든 사람을 잘라 입체로 만들고, 위 컬러 / 아래 알파 영상으로 낸다. 모델은 전부 상업 이용 가능.
person:
  max_eye_width: 1920         # 눈당 처리 폭. 1920 이면 출력 영상 3840x2160 (위 컬러 / 아래 알파 × 좌우)
  # 1) 사람 찾기 — RF-DETR-Seg (Apache-2.0)
  detector: rfdetr_seg_medium # rfdetr_seg_nano | _small | _medium | _large
  detect_threshold: 0.4
  detect_long_side: 1032      # 검출 입력 긴 변 (24의 배수로 맞춤). 높일수록 멀리 작게 나온 사람에 강함
  min_area_frac: 0.002        # 화면의 0.2% 보다 작은 사람은 무시
  # 2) 따라가기 — SAM 2.1 (Apache-2.0). 없으면 매 프레임 검출로 대신
  tracker: sam2               # sam2 | frame_detect
  sam2_size: small            # tiny | small | base_plus | large
  sam2_offload_state: false   # true 면 VRAM 대신 속도를 내준다 (긴 영상용)
  keyframe_sec: 0.5           # 이 간격으로 새로 들어온 사람을 찾는다
  iou_new: 0.3                # 박스 겹침이 이보다 작고…
  link_dist: 1.0              # …몸 높이 × 이 값보다 멀리 움직였으면 새 사람
  min_confirm: 2              # 키프레임 이만큼 잡혀야 등록 (포스터·마네킹 오검출 걸러내기)
  strong_score: 0.8           # 이 점수 이상이면 한 번만 잡혀도 등록
  max_miss: 3                 # 이만큼 연속으로 안 잡히면 그 사람은 끝
  max_people: 8
  # 3) 경계 다듬기 — BiRefNet-matting (MIT). none 이면 모델 없이 마스크 경계만 부드럽게
  matter: birefnet_matting    # birefnet_matting | birefnet_portrait | none
  core_frac: 0.010            # 마스크 안쪽 이 폭(화면 높이 비율)까지는 무조건 불투명
  band_frac: 0.016            # 마스크 바깥 이 폭까지만 매팅 값, 그 밖은 무조건 투명
  # 4) 깊이 — Apache-2.0 인 Small 만 (Base/Large 는 비상업)
  image_depth_model: da2_small    # da2_small | none
  video_depth_model: vda_small    # vda_small | da2_video_small | none
  depth_group: 240            # VDA 한 번에 넣는 프레임 수 (긴 영상은 겹치게 나눠 넣고 눈금 맞춤)
  depth_overlap: 16
  depth_store_width: 960
  # 5) 좌우 영상
  relief_px: 10.0             # 1080 줄 기준 전체 시차 폭(px). 2m 앞 사람 몸 두께 ≈ 6px. 크면 과장됨
  convergence: front          # front: 가장 앞 사람이 화면 거리 | mean: 사람 평균
  # 6) 인코딩
  codec: libx265
  crf: 18
  mask_path: null             # (사진) 사람 마스크 PNG 직접 지정

